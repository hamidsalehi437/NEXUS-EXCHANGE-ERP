# =============================================================================
# NEXUS EXCHANGE ERP — nginx main configuration (PART 44)
# =============================================================================
# The edge terminates client connections and is the only service published
# outside the compose network. TLS is terminated here in production: see
# docs/DEPLOYMENT.md for the certificate mount and the `server` block that
# enables it (HTTP is used for local and staging runs).
#
# Nothing secret lives in this file.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact nginx version to unauthenticated clients.
    server_tokens off;

    log_format nexus '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'rid=$request_id';

    access_log /dev/stdout nexus;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Bodies are JSON documents; anything larger than this is not a legitimate
    # request to this API (reports are exported by the server, not uploaded).
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain;

    # ------------------------------------------------------------------ limits
    # A coarse outer guard in front of the application's own per-route limits
    # (RATE_LIMIT_*). A shared zone per source address; nginx returns 429.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    # ------------------------------------------------------ forwarded headers
    # Only the compose subnet may set X-Forwarded-*; anything else arriving at
    # this edge with those headers has them overwritten by the location blocks.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
