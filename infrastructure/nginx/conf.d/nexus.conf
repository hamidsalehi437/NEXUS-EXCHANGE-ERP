# =============================================================================
# NEXUS EXCHANGE ERP — edge site (PART 44)
# =============================================================================
# Single public entry point for the API. Everything under /api/ is forwarded to
# the FastAPI application; anything else is refused, so an unexpected path can
# never reach an internal service.
# =============================================================================

upstream nexus_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 500;
}

# Connection-level hard stops for a client that stalls mid-request.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
proxy_buffer_size 16k;
proxy_buffers 8 16k;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Liveness of the edge itself (used by the container health check).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Login and token endpoints: strict per-address limit and no request buffering
    # of credentials to disk.
    location ~ ^/api/v1/auth/(login|refresh|logout)$ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_conn api_conn 20;
        client_body_buffer_size 32k;
        proxy_pass http://nexus_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn api_conn 50;
        proxy_pass http://nexus_api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # The OpenAPI document and interactive docs are development tooling. They are
    # not published by the edge; use `docker compose exec api` to inspect them.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Never serve dotfiles or backup leftovers, whatever a misconfigured mount
    # might put in the html root.
    location ~ /\. {
        deny all;
    }

    location / {
        return 404;
    }
}
