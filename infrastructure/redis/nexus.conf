# =============================================================================
# NEXUS EXCHANGE ERP — Redis configuration (PART 44)
# =============================================================================
# Base configuration for the compose `redis` service. The authentication directive
# is NOT here: the container entry point appends it (with the value taken from the
# environment) to a copy of this file in /tmp before starting the server, so no
# secret is committed and the password never appears in the process arguments.
# =============================================================================

# Broker + result backend + runtime cache. Losing this data in a crash costs
# queued task deliveries, so AOF is on; it does not hold financial truth
# (PostgreSQL is the source of truth — PART 64).
appendonly yes
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes

# No key may be evicted: an evicted Celery message or idempotency lock is a
# silent correctness problem, so a full instance must fail loudly (OOM) instead.
maxmemory-policy noeviction
maxmemory-samples 5

# Persistence files live on the named volume mounted at /data.
dir /data

# Sessions/clients are behind nginx or a worker process only; idle timeouts are
# generous enough for long task polling but never infinite.
timeout 300
tcp-keepalive 60

# Operational visibility, without dumping every command.
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128

# Redis's own crash report: keep location explicit and inside the volume.
# (The server still runs as uid 999 with no capabilities — see docker-compose.yml.)
databases 16
