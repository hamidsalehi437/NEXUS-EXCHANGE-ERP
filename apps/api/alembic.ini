# NEXUS EXCHANGE ERP — Alembic configuration (PART 1, PART 44)
#
# The database URL is NOT stored here. It is read from the validated settings
# (DATABASE_MIGRATION_URL) inside alembic/env.py, so no credential ever lives in a
# file that is committed (PART 42).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Revision files: 20260911_1400_0001_initial_schema.py (UTC timestamp + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Versions are written by developers, formatted by ruff (see post_write_hooks).
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
